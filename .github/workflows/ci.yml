name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ubuntu:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_TAG: "20261104"
      LLVM_MINGW_NAME: "llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64"
      LLVM_MINGW_SHA256: "919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zip ninja-build

      - name: Install llvm-mingw
        run: |
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          ls $RUNNER_TEMP

      - name: Build
        run: |
          git submodule update --init --recursive
          make LLVM_MINGW_PATH=$RUNNER_TEMP/$LLVM_MINGW_NAME
          mv build/mikuterm-x64/*.zip mikuterm-x64.zip
          mv build/mikuterm-arm64/*.zip mikuterm-arm64.zip
          mv build/mikuterm-x86/*.zip mikuterm-x86.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            mikuterm-x64.zip
            mikuterm-arm64.zip
            mikuterm-x86.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools, and NDK r28
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build APK
        env:
          APK_KEY_STORE_JKS: ${{ secrets.APK_KEY_STORE_JKS }}
          APK_KEY_STORE_ALIAS: ${{ secrets.APK_KEY_STORE_ALIAS }}
          MIKUTERM_KS_PASS: ${{ secrets.APK_KEY_STORE_PASSWORD }}
        run: |
          git submodule update --init --recursive
          SIGN_ARGS=""
          if [ -n "$APK_KEY_STORE_JKS" ] && [ -n "$MIKUTERM_KS_PASS" ]; then
            printf '%s' "$APK_KEY_STORE_JKS" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/key-store.jks"
            KEY_ALIAS="$APK_KEY_STORE_ALIAS"
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/key-store.jks" -storepass:env MIKUTERM_KS_PASS \
                | awk -F, '/PrivateKeyEntry/{print $1; exit}')
            fi
            if [ -z "$KEY_ALIAS" ]; then
              echo "No key alias found for key-store.jks" >&2
              exit 1
            fi
            SIGN_ARGS="-DMIKUTERM_DEBUGGABLE=OFF -DMIKUTERM_KEYSTORE=$RUNNER_TEMP/key-store.jks -DMIKUTERM_KEY_ALIAS=$KEY_ALIAS"
          fi
          cmake -S external/zedBSD/apps/terminal-android -B build/android -G Ninja \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358" \
            $SIGN_ARGS
          cmake --build build/android --target apk -j "$(nproc)"
          cp build/android/mikuterm-*.apk mikuterm.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: mikuterm.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - build-ubuntu
      - build-android
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: false

          body: |
            mikuterm
            ========
            
            `mikuterm` (Micro Unicode Terminal) is an SSH terminal for Windows,
            featuring a Vulkan-accelerated X11 server for X-forwarding and an
            on-demand graphical SFTP client.
            
            | Name        | OS                | Description                                       |
            |-------------|-------------------|---------------------------------------------------|
            | mikuterm    | Windows 11 x64    |                                                   |
            | mikuterm    | Windows 11 arm64  |                                                   |
            | mikuterm    | Windows 10 x86    |                                                   |
            | mikuterm    | Android           |                                                   |

          files: |
            artifacts/mikuterm-x64.zip
            artifacts/mikuterm-x86.zip
            artifacts/mikuterm-arm64.zip
            artifacts/mikuterm.apk
